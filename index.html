<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>City Climate Comparator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap");
    :root {
      --bg:#fafafa;--text:#1a1a1a;--muted:#5c5c5c;--border:#e4e4e4;
      --accent:#2563eb;--accent-soft:#dbeafe;--amber:#d97706;--amber-soft:#fff7ed;
      --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.06);--shadow-lg:0 8px 30px rgba(0,0,0,.08);
      --font:"DM Sans",system-ui,sans-serif;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;}
    .wrap{max-width:1200px;margin:0 auto;padding:1.5rem 1rem 3rem;}
    header{text-align:center;margin-bottom:1.5rem;}
    h1{font-size:clamp(1.4rem,4vw,1.9rem);font-weight:700;letter-spacing:-0.02em;margin-bottom:0.3rem;}
    .subtitle{color:var(--muted);font-size:0.9rem;margin-bottom:1.25rem;}
    .search-row{display:flex;gap:.5rem;justify-content:center;max-width:520px;margin:0 auto .75rem;}
    .search-row input{flex:1;padding:.75rem 1rem;border:1px solid var(--border);border-radius:var(--radius);font:inherit;font-size:1rem;background:#fff;transition:border-color .2s,box-shadow .2s;}
    .search-row input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
    .search-row button{padding:.75rem 1.35rem;border:none;border-radius:var(--radius);background:var(--text);color:#fff;font:inherit;font-weight:600;cursor:pointer;transition:opacity .2s;}
    .search-row button:hover{opacity:.85;}
    .status{text-align:center;min-height:1.4rem;font-size:.85rem;color:var(--muted);margin-bottom:1rem;}
    .status.error{color:#b91c1c;}
    .filters{margin-bottom:1.25rem;}
    .filters-label{font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:.5rem;text-align:center;}
    .pill-row{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;}
    .pill{border:1px solid var(--border);background:#fff;color:var(--text);padding:.45rem 1rem;border-radius:999px;font:inherit;font-size:.85rem;font-weight:500;cursor:pointer;transition:all .15s;}
    .pill:hover{border-color:#aaa;}
    .pill.active{background:var(--text);color:#fff;border-color:var(--text);}
    #map{width:100%;height:clamp(300px,48vh,520px);border-radius:calc(var(--radius) + 4px);border:1px solid var(--border);box-shadow:var(--shadow-lg);margin-bottom:1.5rem;}
    .koppen-legend{background:#fff;border:1px solid var(--border);border-radius:10px;padding:.6rem .9rem;font-size:.78rem;line-height:1.9;box-shadow:var(--shadow);max-width:220px;}
    .koppen-legend b{font-weight:600;display:block;margin-bottom:.2rem;font-size:.75rem;}
    .k-dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:middle;}
    .results-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:.5rem;margin-bottom:1rem;}
    .results-head h2{font-size:1rem;font-weight:600;}
    .results-meta{font-size:.8rem;color:var(--muted);}
    .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1rem;}
    .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:1rem 1.1rem;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);animation:cardIn .4s ease forwards;}
    .card.origin{border-color:var(--accent);background:linear-gradient(135deg,#fff 0%,var(--accent-soft) 100%);}
    .card h3{font-size:1rem;font-weight:600;margin-bottom:.15rem;}
    .card .country{font-size:.78rem;color:var(--muted);margin-bottom:.7rem;}
    .badge{display:inline-block;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:.2rem .5rem;border-radius:6px;margin-bottom:.6rem;}
    .badge.ob{background:var(--accent);color:#fff;}
    .badge.mb{background:var(--amber-soft);color:var(--amber);}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:.4rem .75rem;font-size:.8rem;}
    .stats dt{color:var(--muted);font-size:.7rem;}
    .stats dd{font-weight:600;}
    .kname{font-size:.72rem;color:var(--muted);font-style:italic;margin-top:.25rem;}
    #resultsSection{display:none;}
    @keyframes cardIn{to{opacity:1;transform:translateY(0);}}
    .card:nth-child(1){animation-delay:.02s}.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.08s}
    .card:nth-child(4){animation-delay:.11s}.card:nth-child(5){animation-delay:.14s}.card:nth-child(6){animation-delay:.17s}
    .card:nth-child(7){animation-delay:.20s}.card:nth-child(8){animation-delay:.23s}.card:nth-child(9){animation-delay:.26s}
    @media(max-width:600px){.wrap{padding:1rem .75rem 2rem;}}
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>City Climate Comparator</h1>
    <p class="subtitle">Search any city and find others that share its latitude, timezone, climate, or sunlight hours.</p>
    <div class="search-row">
      <input type="text" id="citySearch" placeholder="e.g. San Francisco, Tokyo, Lagos…" autocomplete="off" />
      <button type="button" id="searchBtn">Compare</button>
    </div>
    <div class="status" id="status">Enter a city to get started — 719 cities in the dataset.</div>
  </header>

  <section class="filters">
    <p class="filters-label">Match by (toggle any combination)</p>
    <div class="pill-row" id="filterPills"></div>
  </section>

  <div id="map"></div>

  <section id="resultsSection">
    <div class="results-head">
      <h2>Matching Cities</h2>
      <span class="results-meta" id="resultsMeta"></span>
    </div>
    <div class="cards" id="cards"></div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>

function norm(s){return(s||"").toLowerCase().trim();}

function rankDataset(q){
  q=norm(q);if(!q)return[];
  var out=[];
  CITIES.forEach(function(c){
    var cn=norm(c.name),score=0;
    if(cn===q)score=1000;
    else if(cn.indexOf(q)===0)score=900;
    else if(cn.indexOf(q)>=0)score=800;
    else if(q.length>=3&&norm(c.country).indexOf(q)>=0)score=300;
    if(score>0)out.push({city:c,score:score});
  });
  out.sort(function(a,b){return b.score-a.score;});
  return out;
}

// Hard filter tolerances — city must pass ALL active filters to be eligible
var TOLERANCES = {latitude:8, timezone:2, sunlight:400};

function passesHardFilters(c) {
  if (!searchResult) return false;
  if (c.name === searchResult.name && c.country === searchResult.country) return false;
  if (c.country === searchResult.country) return false;
  if (filterState.latitude  && Math.abs(c.lat - searchResult.lat) > TOLERANCES.latitude)  return false;
  if (filterState.timezone  && Math.abs(c.tz  - searchResult.tz)  > TOLERANCES.timezone)  return false;
  if (filterState.koppen    && c.koppen !== searchResult.koppen) return false;
  if (filterState.sunlight  && Math.abs(c.sun - searchResult.sun) > TOLERANCES.sunlight)   return false;
  return true;
}

function scoreCity(c) {
  var activeFilters = 0, totalScore = 0;
  if (filterState.latitude) {
    activeFilters++;
    var latDiff = Math.abs(c.lat - searchResult.lat);
    totalScore += 1 - latDiff / TOLERANCES.latitude;
  }
  if (filterState.timezone) {
    activeFilters++;
    var tzDiff = Math.abs(c.tz - searchResult.tz);
    totalScore += 1 - tzDiff / TOLERANCES.timezone;
  }
  if (filterState.koppen) {
    activeFilters++;
    totalScore += c.koppen === searchResult.koppen ? 1 : 0;
  }
  if (filterState.sunlight) {
    activeFilters++;
    var sunDiff = Math.abs(c.sun - searchResult.sun);
    totalScore += 1 - sunDiff / TOLERANCES.sunlight;
  }
  if (activeFilters === 0) return 1;
  return totalScore / activeFilters;
}

function getTopMatches() {
  if (!searchResult) return [];
  var anyOn = filterState.latitude || filterState.timezone || filterState.koppen || filterState.sunlight;

  // Step 1: filter eligible cities (hard cutoffs)
  var eligible = CITIES.filter(function(c) {
    if (!anyOn) {
      // no filters: just exclude same city and same country
      return !(c.name === searchResult.name && c.country === searchResult.country) && c.country !== searchResult.country;
    }
    return passesHardFilters(c);
  });

  // Step 2: score each eligible city
  var scored = eligible.map(function(c) {
    return { city: c, score: scoreCity(c) };
  });

  // Step 3: best city per country (highest score; tie → highest pop)
  var byCountry = {};
  scored.forEach(function(item) {
    var cc = item.city.country;
    if (!byCountry[cc] ||
        item.score > byCountry[cc].score ||
        (item.score === byCountry[cc].score && item.city.pop > byCountry[cc].city.pop)) {
      byCountry[cc] = item;
    }
  });

  // Step 4: sort countries by score desc, then by population desc
  var best = Object.values(byCountry);
  best.sort(function(a, b) {
    if (Math.abs(b.score - a.score) > 0.001) return b.score - a.score;
    return b.city.pop - a.city.pop;
  });

  return best.slice(0, 10).map(function(item) { return item.city; });
}

function passes(c) {
  var matches = getTopMatches();
  return matches.some(function(m) { return m.name === c.name && m.country === c.country; });
}


function fmtTz(h){
  var s=h>=0?"+":"-",a=Math.abs(h),hh=Math.floor(a),mm=Math.round((a-hh)*60);
  return"UTC"+s+hh+(mm?":"+(mm<10?"0":"")+mm:"");
}

function esc(t){var d=document.createElement("div");d.textContent=t;return d.innerHTML;}

function clearLayers(){
  if(originMarker){map.removeLayer(originMarker);originMarker=null;}
  matchMarkers.forEach(function(m){map.removeLayer(m);});matchMarkers=[];
  if(latLine){map.removeLayer(latLine);latLine=null;}
  if(legendCtrl){map.removeControl(legendCtrl);legendCtrl=null;}
  if(koppenLayer){map.removeLayer(koppenLayer);koppenLayer=null;}
}

function loadKoppenOverlay(code,color){
  if(koppenLayer){map.removeLayer(koppenLayer);koppenLayer=null;}
  var url="https://cdn.jsdelivr.net/gh/rjerue/koppen-map@master/data/"+encodeURIComponent(code)+".json";
  fetch(url)
    .then(function(r){
      if(!r.ok)throw new Error("HTTP "+r.status);
      return r.json();
    })
    .then(function(gj){
      koppenLayer=L.geoJSON(gj,{
        style:function(){
          return{
            fillColor:color,
            fillOpacity:0.28,
            color:color,
            weight:0.8,
            opacity:0.6
          };
        },
        interactive:false
      });
      koppenLayer.addTo(map);
      koppenLayer.bringToBack();
    })
    .catch(function(e){
      console.warn("Köppen GeoJSON load failed for "+code+": "+e.message);
    });
}

function updateMap(){
  clearLayers();
  if(!searchResult)return;

  originMarker=L.circleMarker([searchResult.lat,searchResult.lng],{
    radius:12,fillColor:"#2563eb",color:"#fff",weight:2.5,fillOpacity:1
  }).addTo(map).bindPopup(
    "<b>"+esc(searchResult.name)+"</b>, "+esc(searchResult.country)+
    "<br><b>Köppen:</b> "+esc(searchResult.koppen)+" — "+esc(ki(searchResult.koppen).name)+
    "<br><b>Lat:</b> "+searchResult.lat.toFixed(2)+"° | <b>Sun:</b> "+searchResult.sun+" h/yr"
  );

  if(filterState.latitude){
    var pts=[];for(var ln=-180;ln<=180;ln+=2)pts.push([searchResult.lat,ln]);
    latLine=L.polyline(pts,{color:"#2563eb",weight:1.5,opacity:0.45,dashArray:"6 5"}).addTo(map);
  }

  var matches=getTopMatches();
  matches.forEach(function(c){
    var m=L.circleMarker([c.lat,c.lng],{
      radius:9,fillColor:"#d97706",color:"#fff",weight:2,fillOpacity:0.9
    }).addTo(map).bindPopup(
      "<b>"+esc(c.name)+"</b>, "+esc(c.country)+
      "<br><b>Köppen:</b> "+esc(c.koppen)+" — "+esc(ki(c.koppen).name)+
      "<br><b>Lat:</b> "+c.lat.toFixed(2)+"° | <b>Sun:</b> "+c.sun+" h/yr"
    );
    matchMarkers.push(m);
  });

  if(filterState.koppen){
    var kInfo=ki(searchResult.koppen);
    legendCtrl=L.control({position:"bottomright"});
    legendCtrl.onAdd=function(){
      var d=L.DomUtil.create("div","koppen-legend");
      d.innerHTML="<b>Köppen Filter Active</b>"+
        "<span class='k-dot' style='background:"+kInfo.color+"'></span>"+
        "<b>"+esc(searchResult.koppen)+"</b> — "+esc(kInfo.name)+
        "<br><span style='font-size:.7rem;color:#666;'>Shaded region = matching climate zone</span>";
      return d;
    };
    legendCtrl.addTo(map);
    loadKoppenOverlay(searchResult.koppen, kInfo.color);
  }

  var allPts=[[searchResult.lat,searchResult.lng]];
  matches.forEach(function(c){allPts.push([c.lat,c.lng]);});
  if(allPts.length>1){
    map.fitBounds(L.latLngBounds(allPts),{padding:[50,50],maxZoom:5});
  }else{
    map.setView([searchResult.lat,searchResult.lng],4);
  }
}

function renderCards(){
  if(!searchResult){document.getElementById("resultsSection").style.display="none";return;}
  var matches=getTopMatches();
  document.getElementById("resultsSection").style.display="block";
  document.getElementById("resultsMeta").textContent=
    matches.length+" best match"+(matches.length!==1?"es":"")+" (1 per country, sorted by fit)";

  var kInfo=ki(searchResult.koppen);
  var html='<article class="card origin">'+
    '<span class="badge ob">Your city</span>'+
    '<h3>'+esc(searchResult.name)+'</h3>'+
    '<p class="country">'+esc(searchResult.country)+' · '+(searchResult.pop>=1000000?(searchResult.pop/1000000).toFixed(1)+'M pop':Math.round(searchResult.pop/1000)+'K pop')+'</p>'+
    '<dl class="stats">'+
    '<dt>Latitude</dt><dd>'+searchResult.lat.toFixed(2)+'°</dd>'+
    '<dt>Timezone</dt><dd>'+fmtTz(searchResult.tz)+'</dd>'+
    '<dt>Sunlight/yr</dt><dd>'+searchResult.sun+' h</dd>'+
    '<dt>Köppen</dt><dd>'+esc(searchResult.koppen)+'</dd>'+
    '</dl>'+
    '<p class="kname"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+kInfo.color+';margin-right:4px;vertical-align:middle;"></span>'+esc(kInfo.name)+'</p>'+
    '</article>';

  matches.forEach(function(c,i){
    var cki=ki(c.koppen);
    var matchScore=scoreCity(c);
    var scoreDisplay=matchScore>=0?(Math.round(matchScore*100)+"% match"):"";
    var popDisplay=c.pop>=1000000?(c.pop/1000000).toFixed(1)+"M pop":c.pop>=1000?Math.round(c.pop/1000)+"K pop":"";
    html+='<article class="card" style="animation-delay:'+(0.04*(i+1))+'s">'+
      '<span class="badge mb">'+scoreDisplay+'</span>'+
      '<h3>'+esc(c.name)+'</h3>'+
      '<p class="country">'+esc(c.country)+' · '+popDisplay+'</p>'+
      '<dl class="stats">'+
      '<dt>Latitude</dt><dd>'+c.lat.toFixed(2)+'°</dd>'+
      '<dt>Timezone</dt><dd>'+fmtTz(c.tz)+'</dd>'+
      '<dt>Sunlight/yr</dt><dd>'+c.sun+' h</dd>'+
      '<dt>Köppen</dt><dd>'+esc(c.koppen)+'</dd>'+
      '</dl>'+
      '<p class="kname"><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:'+cki.color+';margin-right:4px;vertical-align:middle;"></span>'+esc(cki.name)+'</p>'+
      '</article>';
  });

  document.getElementById("cards").innerHTML=html;
}

function setStatus(msg,err){
  var s=document.getElementById("status");
  s.textContent=msg;s.className="status"+(err?" error":"");
}

function doSearch(){
  var q=(document.getElementById("citySearch").value||"").trim();
  if(!q){setStatus("Enter a city name.",true);return;}
  var ranked=rankDataset(q);
  if(!ranked.length){setStatus("No match found — try another city.",true);return;}
  searchResult=ranked[0].city;
  setStatus("Showing results for "+searchResult.name+", "+searchResult.country+".");
  updateMap();renderCards();
}

function buildPills(){
  var row=document.getElementById("filterPills");
  ["latitude","timezone","koppen","sunlight"].forEach(function(id){
    var btn=document.createElement("button");
    btn.className="pill"+(filterState[id]?" active":"");
    btn.textContent=FILTER_LABELS[id];
    btn.addEventListener("click",function(){
      filterState[id]=!filterState[id];
      btn.classList.toggle("active",filterState[id]);
      updateMap();renderCards();
    });
    row.appendChild(btn);
  });
}

initMap();buildPills();
document.getElementById("searchBtn").addEventListener("click",doSearch);
document.getElementById("citySearch").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch();});
})();
</script>
</body>
</html>
